services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: saldo_db
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: saldo_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - saldo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saldo -d saldo_db"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  saldo_pgdata:
